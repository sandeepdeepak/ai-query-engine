services:
  - type: web
    name: ai-query-engine-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: PUBLIC_API_ACCESS_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: IPL_API_URL
        sync: false
      - key: IPL_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
